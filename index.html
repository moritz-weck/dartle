<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Darts Who Are Ya?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <!-- Header -->
        <header class="game-header">
            <h1>Guess the Tour Card Holder</h1>

        </header>


        <!-- Game Status -->
        <section class="game-status">

            <p id="guess-counter">
                Data last updated: 10/09/2026 <br>
                Tries Used <span id="current-guess">0</span> / 6
            </p>

        </section>


        <!-- Player Search -->
        <section class="player-search">

            <label for="player-input">
                Choose Player
            </label>

            <div class="search-wrapper">

                <input
                    type="text"
                    id="player-input"
                    placeholder="Spieler suchen..."
                    autocomplete="off"
                >

                <button id="guess-button">
                    Guess
                </button>

            </div>


            <!-- Autocomplete Results -->
            <div
                id="autocomplete-list"
                class="autocomplete-list"
            >
            </div>

        </section>


       <div class="results-scroll">
            <div class="result-header">
                <div>Spieler</div>
                <div>Land</div>
                <div>Alter</div>
                <div>Ranking</div>
                <div>Major Titles</div>
                <div>Floor Titles</div>
                <div>Tour Card Since</div>
            </div>

            <section id="guesses-container" class="guesses-container"></section>
        </div>


        <!-- Win / Lose Message -->
        <section
            id="game-message"
            class="game-message hidden"
        >

            <h2 id="game-message-title"></h2>

            <p id="game-message-text"></p>

            <button
                id="new-game-button"
                class="hidden"
            >
                New Game
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
